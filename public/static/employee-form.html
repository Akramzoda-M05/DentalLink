<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Новый сотрудник — University HR / DentalLink</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  <link href="../assets/css/app.css" rel="stylesheet">
</head>
<body>
  <header class="mockup-header">
    <div class="container d-flex flex-wrap align-items-center justify-content-between gap-3">
      <a class="mockup-logo" href="layout.html">
        <span>DentalLink 🦷</span>
      </a>
      <div class="d-flex flex-wrap align-items-center gap-2">
        <a href="doctors.html" class="nav-pill-btn">Сотрудники / Врачи</a>
        <a href="leave-form.html" class="nav-pill-btn">Заявка на отпуск</a>
        <a href="employee-form.html" class="nav-pill-btn active">Новый сотрудник</a>
      </div>
    </div>
  </header>

  <main class="container py-4">
    <div class="row justify-content-center">
      <div class="col-12 col-md-8">
        <!-- В ней нарочно работает встроенная проверка HTML5 без JavaScript:
             required, maxlength="60", type="email", type="tel" с pattern="[0-9+\(\)\s\-]{5,20}",
             type="file" с accept="image/jpeg,image/png,image/webp" и enctype="multipart/form-data" у формы. -->
        <form class="card card-body p-4 shadow-sm" method="post" action="/employees/create" enctype="multipart/form-data" style="border-radius: var(--dl-radius-card);">
          <h1 class="h4 fw-bold mb-3">Карточка нового сотрудника (HTML5 нативная валидация)</h1>

          <div class="mb-3">
            <label class="form-label" for="emp-fullname">ФИО сотрудника *</label>
            <input class="form-control" type="text" id="emp-fullname" name="full_name" required maxlength="60">
          </div>

          <div class="mb-3">
            <label class="form-label" for="emp-email">Email *</label>
            <input class="form-control" type="email" id="emp-email" name="email" required>
          </div>

          <div class="mb-3">
            <label class="form-label" for="emp-phone">Телефон *</label>
            <input class="form-control" type="tel" id="emp-phone" name="phone" pattern="[0-9+\(\)\s\-]{5,20}" required>
          </div>

          <div class="mb-3">
            <label class="form-label" for="emp-avatar">Фото сотрудника</label>
            <input class="form-control" type="file" id="emp-avatar" name="avatar" accept="image/jpeg,image/png,image/webp">
          </div>

          <div class="d-flex justify-content-end gap-2">
            <a href="doctors.html" class="btn btn-outline-secondary">Отмена</a>
            <button type="submit" class="btn btn-primary">Сохранить</button>
          </div>
        </form>
      </div>
    </div>
  </main>

  <footer class="app-footer py-4 mt-auto">
    <div class="container text-center">
      <p class="mb-0 text-muted small">© 2026 DentalLink / University HR. Лабораторная работа 11.</p>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
</body>
</html>
