<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Заявка на отпуск — University HR / DentalLink</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  <link href="../assets/css/app.css" rel="stylesheet">
</head>
<body>
  <header class="mockup-header">
    <div class="container d-flex flex-wrap align-items-center justify-content-between gap-3">
      <a class="mockup-logo" href="layout.html">
        <span>DentalLink 🦷</span>
      </a>
      <div class="d-flex flex-wrap align-items-center gap-2">
        <a href="doctors.html" class="nav-pill-btn">Сотрудники / Врачи</a>
        <a href="leave-form.html" class="nav-pill-btn active">Заявка на отпуск</a>
        <a href="employee-form.html" class="nav-pill-btn">Новый сотрудник</a>
      </div>
    </div>
  </header>

  <main class="container py-4">
    <div class="row justify-content-center">
      <div class="col-12 col-md-8">
        <!-- novalidate: стандартные «пузыри» браузера отключены, сообщения показывает app.js.
             Сервер (PHP) всё равно проверяет каждое поле заново! -->
        <form id="leave-form" class="card card-body p-4 shadow-sm" method="post" action="/leaves/create" novalidate style="border-radius: var(--dl-radius-card);">
          <h1 class="h4 fw-bold mb-3">Заявление на отпуск сотрудника</h1>

          <div class="mb-3">
            <label class="form-label" for="leave-type">Тип отпуска *</label>
            <select class="form-select" id="leave-type" name="type" required aria-describedby="leave-type-error">
              <option value="">Выберите тип</option>
              <option value="annual">Ежегодный</option>
              <option value="study">Учебный</option>
              <option value="unpaid">Без сохранения з/п</option>
              <option value="sick">По болезни</option>
            </select>
            <div class="invalid-feedback" id="leave-type-error"></div>
          </div>

          <div class="row g-3 mb-3">
            <div class="col-sm-6">
              <label class="form-label" for="start-date">Дата начала *</label>
              <input class="form-control" type="date" id="start-date" name="start_date" required aria-describedby="start-date-error">
              <div class="invalid-feedback" id="start-date-error"></div>
            </div>

            <div class="col-sm-6">
              <label class="form-label" for="end-date">Дата окончания *</label>
              <input class="form-control" type="date" id="end-date" name="end_date" required aria-describedby="end-date-error">
              <div class="invalid-feedback" id="end-date-error"></div>
            </div>
          </div>

          <div class="mb-3">
            <label class="form-label" for="reason">Причина или обоснование</label>
            <textarea class="form-control" id="reason" name="reason" maxlength="255" rows="3" aria-describedby="reason-error"></textarea>
            <div class="invalid-feedback" id="reason-error"></div>
          </div>

          <div class="d-flex justify-content-end gap-2">
            <a href="doctors.html" class="btn btn-outline-secondary">Отмена</a>
            <button type="submit" class="btn btn-primary">Отправить заявку</button>
          </div>
        </form>
      </div>
    </div>
  </main>

  <footer class="app-footer py-4 mt-auto">
    <div class="container text-center">
      <p class="mb-0 text-muted small">© 2026 DentalLink / University HR. Лабораторная работа 11.</p>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
  <script type="module" src="../assets/js/app.js"></script>
</body>
</html>
