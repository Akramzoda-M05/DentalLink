<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Вход — DentalLink</title>
  <meta name="description" content="Экран авторизации пользователя по макету Figma и UI-kit.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <!-- Bootstrap 5.3.3 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  <!-- Стили по UI-kit -->
  <link href="../assets/css/app.css" rel="stylesheet">
</head>
<body class="d-flex flex-column min-vh-100 justify-content-center" style="background-color: var(--dl-bg);">
  <main class="container d-flex flex-column align-items-center justify-content-center my-auto py-5">
    <!-- Карточка авторизации: Макет 1 в цветном UI-kit стиле -->
    <div class="login-card-container">
      <div class="text-center mb-3">
        <span class="fs-1">🦷</span>
      </div>
      <h1 class="login-title">Вход в систему</h1>

      <form action="layout.html" method="get">
        <div class="mb-3">
          <label for="login-username" class="visually-hidden">Логин</label>
          <input type="text" class="login-pill-input" id="login-username" name="username" placeholder="Логин или телефон" required>
        </div>

        <div class="mb-4">
          <label for="login-password" class="visually-hidden">Пароль</label>
          <input type="password" class="login-pill-input" id="login-password" name="password" placeholder="Пароль" required>
        </div>

        <div>
          <button type="submit" class="login-pill-btn">Войти</button>
        </div>
      </form>

      <div class="text-center mt-4">
        <a href="doctors.html" class="text-decoration-none text-primary small fw-semibold">← Перейти к каталогу специалистов</a>
      </div>
    </div>
  </main>

  <!-- Подвал сайта -->
  <footer class="app-footer py-3 mt-auto">
    <div class="container text-center">
      <p class="mb-0 text-muted small">© 2026 DentalLink. Вёрстка экрана авторизации в фирменных стилях.</p>
    </div>
  </footer>

  <!-- Bootstrap Bundle JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
</body>
</html>
